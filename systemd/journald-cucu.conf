# Installato da setup.sh e dall'OTA in /etc/systemd/journald.conf.d/50-cucu.conf:
# il log di sistema resta dopo un riavvio (Raspberry Pi OS lo tiene solo in RAM),
# così si può capire cosa è successo prima di uno spegnimento. Piccolo, per la SD.
[Journal]
Storage=persistent
SystemMaxUse=32M
SystemMaxFileSize=4M
