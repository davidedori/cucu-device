# Captive portal dell'hotspot di Cucù (installato da setup.sh e da updater.sh in
# /etc/NetworkManager/dnsmasq-shared.d/). Vale solo per le connessioni "shared"
# di NetworkManager, cioè l'hotspot cucu-xxxx_AP: sulla rete di casa non c'entra.
# Ogni nome risponde 10.42.0.1, quindi il controllo che fanno i telefoni appena
# collegati (captive.apple.com, connectivitycheck.gstatic.com, ...) arriva
# all'API, che lo manda alla pagina del Wi-Fi: la pagina si apre da sola.
address=/#/10.42.0.1
